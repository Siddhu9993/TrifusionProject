<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Chagan Paan Bhandar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .hidden-view { display: none; }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 font-sans antialiased">
    
    <!-- Login View -->
    <div id="loginView" class="min-h-screen flex items-center justify-center">
        <div class="max-w-md w-full bg-white rounded-xl shadow-lg p-8">
            <h2 class="text-2xl font-bold text-center text-gray-900 mb-6">Admin Login</h2>
            <form id="loginForm" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700">Email</label>
                    <input type="email" id="email" required class="mt-1 block w-full px-4 py-2 border border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Password</label>
                    <input type="password" id="password" required class="mt-1 block w-full px-4 py-2 border border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500">
                </div>
                <div id="loginError" class="text-red-500 text-sm hidden-view"></div>
                <button type="submit" class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500">
                    Sign In
                </button>
            </form>
        </div>
    </div>

    <!-- Dashboard View -->
    <div id="dashboardView" class="hidden-view min-h-screen">
        <nav class="bg-white shadow-sm border-b border-gray-200">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                <div class="flex justify-between h-16">
                    <div class="flex items-center">
                        <h1 class="text-xl font-bold text-gray-900">Admin Dashboard</h1>
                    </div>
                    <div class="flex items-center">
                        <button id="logoutBtn" class="ml-4 px-4 py-2 text-sm text-red-600 hover:text-red-900 font-medium">Logout</button>
                    </div>
                </div>
            </div>
        </nav>

        <main class="max-w-7xl mx-auto py-6 sm:px-6 lg:px-8">
            <div class="px-4 py-6 sm:px-0">
                <h2 class="text-2xl font-semibold mb-4">Contact Leads</h2>
                <div class="bg-white shadow overflow-hidden sm:rounded-lg">
                    <table class="min-w-full divide-y divide-gray-200">
                        <thead class="bg-gray-50">
                            <tr>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Date</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Name / Email</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Company / Service</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Message</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Status</th>
                            </tr>
                        </thead>
                        <tbody id="leadsTableBody" class="bg-white divide-y divide-gray-200">
                            <!-- Rows injected by JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script>
        const API_BASE = '/api';
        let authToken = localStorage.getItem('adminToken');

        const loginView = document.getElementById('loginView');
        const dashboardView = document.getElementById('dashboardView');
        const loginForm = document.getElementById('loginForm');
        const loginError = document.getElementById('loginError');
        const leadsTableBody = document.getElementById('leadsTableBody');
        const logoutBtn = document.getElementById('logoutBtn');

        function checkAuth() {
            if (authToken) {
                loginView.classList.add('hidden-view');
                dashboardView.classList.remove('hidden-view');
                loadLeads();
            } else {
                loginView.classList.remove('hidden-view');
                dashboardView.classList.add('hidden-view');
            }
        }

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                const res = await fetch(`${API_BASE}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await res.json();
                
                if (res.ok) {
                    authToken = data.token;
                    localStorage.setItem('adminToken', authToken);
                    loginError.classList.add('hidden-view');
                    checkAuth();
                } else {
                    loginError.textContent = data.error || 'Login failed';
                    loginError.classList.remove('hidden-view');
                }
            } catch (err) {
                loginError.textContent = 'Network error';
                loginError.classList.remove('hidden-view');
            }
        });

        logoutBtn.addEventListener('click', () => {
            authToken = null;
            localStorage.removeItem('adminToken');
            checkAuth();
        });

        async function loadLeads() {
            try {
                const res = await fetch(`${API_BASE}/admin/leads`, {
                    headers: { 'Authorization': `Bearer ${authToken}` }
                });
                
                if (res.status === 401 || res.status === 403) {
                    logoutBtn.click();
                    return;
                }
                
                const data = await res.json();
                renderLeads(data.leads || []);
            } catch (err) {
                console.error(err);
            }
        }

        async function updateStatus(id, status) {
            try {
                await fetch(`${API_BASE}/admin/leads/${id}/status`, {
                    method: 'PATCH',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${authToken}`
                    },
                    body: JSON.stringify({ status })
                });
                loadLeads();
            } catch (err) {
                console.error(err);
            }
        }

        function renderLeads(leads) {
            leadsTableBody.innerHTML = leads.map(lead => `
                <tr>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">
                        ${new Date(lead.createdAt).toLocaleDateString()}
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap">
                        <div class="text-sm font-medium text-gray-900">${lead.name}</div>
                        <div class="text-sm text-gray-500">${lead.email}</div>
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap">
                        <div class="text-sm text-gray-900">${lead.company || '-'}</div>
                        <div class="text-sm text-gray-500">${lead.serviceInterest || '-'}</div>
                    </td>
                    <td class="px-6 py-4 text-sm text-gray-500 max-w-xs truncate" title="${lead.message}">
                        ${lead.message}
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap">
                        <select onchange="updateStatus('${lead.id}', this.value)" class="text-sm border-gray-300 rounded-md focus:ring-blue-500 focus:border-blue-500">
                            <option value="NEW" ${lead.status === 'NEW' ? 'selected' : ''}>New</option>
                            <option value="IN_PROGRESS" ${lead.status === 'IN_PROGRESS' ? 'selected' : ''}>In Progress</option>
                            <option value="RESOLVED" ${lead.status === 'RESOLVED' ? 'selected' : ''}>Resolved</option>
                        </select>
                    </td>
                </tr>
            `).join('');
        }

        checkAuth();
    </script>
</body>
</html>
